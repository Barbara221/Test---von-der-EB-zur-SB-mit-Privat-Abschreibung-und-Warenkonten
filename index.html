</style></head><body><header><h1>Die Bilanzreise</h1><div>PROBETEST · 6 Stationen · 50 Punkte · verbindliche Abgabe</div></header><main id="app"></main><script>
const CASES=[{"name":"Wellnesshotel Quellenhof","assets":[["Betriebs- und Geschäftsausstattung",96000],["Warenbestand",14500],["Forderungen aus Lieferungen und Leistungen",11800],["Bank",31700],["Kassa",2500]],"liabs":[["Darlehen",62000],["Verbindlichkeiten aus Lieferungen und Leistungen",23500]],"tx":[{"desc":"Eine Reisegruppe begleicht die Rechnung für ihren Wellnessaufenthalt durch Überweisung auf das Bankkonto.","debit":"Bank","credit":"Umsatzerlöse","amount":11200},{"desc":"Für das Frühstücksbuffet werden Lebensmittel auf Ziel eingekauft.","debit":"Wareneinkauf","credit":"Verbindlichkeiten aus Lieferungen und Leistungen","amount":3150},{"desc":"Die monatliche Miete für den externen Spa-Bereich wird auf Ziel in Rechnung gestellt.","debit":"Mietaufwand","credit":"Verbindlichkeiten aus Lieferungen und Leistungen","amount":2250},{"desc":"Die Bank belastet das Konto mit Darlehenszinsen.","debit":"Zinsaufwand","credit":"Bank","amount":480},{"desc":"Der Inhaber entnimmt Bargeld aus der Hotelkassa für private Zwecke.","debit":"Privat","credit":"Kassa","amount":650},{"desc":"Die Ausstattung des Wellnessbereichs wird indirekt abgeschrieben.","debit":"Abschreibung","credit":"Wertberichtigungskonto","amount":2450},{"desc":"Die Inventur ergibt einen höheren Warenbestand als zu Jahresbeginn; die Bestandszunahme wird verbucht.","debit":"Warenbestand","credit":"Bestandsänderung","amount":950}]}];
const A='Betriebs- und Geschäftsausstattung',W='Warenbestand',F='Forderungen aus Lieferungen und Leistungen',B='Bank',K='Kassa',E='Eigenkapital',D='Darlehen',V='Verbindlichkeiten aus Lieferungen und Leistungen',WB='Wertberichtigungskonto',P='Privat',G='GuV',S='SBK';
const names=[P,D,'Umsatzerlöse',K,WB,'Wareneinkauf',E,F,'Zinsaufwand',S,W,'Mietaufwand',B,'Bestandsänderung',G,A,'Zinserträge',V,'Abschreibung','EBK','Personalkosten'];
let c=null,step=0,errors=[],hints=0,person={},history=[];const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:2});const num=x=>{if(x===null||x===undefined||String(x).trim()==='')return NaN;let v=String(x).trim().replace(/\s/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return Number(v)};const eq=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<.011;const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const option=(arr)=>'<option value="">Konto auswählen</option>'+arr.map(x=>`<option>${esc(x)}</option>`).join('');
function model(){let x=CASES[c],start=Object.fromEntries([...x.assets,...x.liabs,[E,x.assets.reduce((s,a)=>s+a[1],0)-x.liabs.reduce((s,a)=>s+a[1],0)]]),bal={...start},ledger={};const add=(name,side,amount)=>{ledger[name]??={debit:[],credit:[]};ledger[name][side].push(amount)};for(let [n,v] of Object.entries(start))add(n,([A,W,F,B,K].includes(n)?'debit':'credit'),v);for(let t of x.tx){add(t.debit,'debit',t.amount);add(t.credit,'credit',t.amount);bal[t.debit]=(bal[t.debit]||0)+t.amount;bal[t.credit]=(bal[t.credit]||0)-t.amount}bal[V]=2*start[V]-bal[V];const expense=['Wareneinkauf','Mietaufwand','Zinsaufwand','Abschreibung','Bestandsänderung'];let income=['Umsatzerlöse','Zinserträge'];let profit=0;for(let n of [...expense,...income])profit-=bal[n]||0;let withdrawal=bal[P]||0;bal[E]=start[E]+profit-withdrawal;const assets=[A,W,F,B,K].map(n=>[n,bal[n]]).filter(v=>Math.abs(v[1])>.01);const liabs=[E,D,V,WB].map(n=>[n,n===WB?-(bal[n]||0):bal[n]]).filter(v=>Math.abs(v[1])>.01);const wb=-(bal[WB]||0);return {x,start,bal,ledger,profit,withdrawal,assets,liabs,wb,expense,income}}
function begin(){person={first:$('first').value.trim(),last:$('last').value.trim(),cl:$('class').value.trim()};if(!person.first||!person.last||!person.cl){$('msg').textContent='Bitte geben Sie Vorname, Nachname und Klasse ein.';return}c=0;step=1;history=[];draw()}
function choose(){c=null;step=0;draw()}
function select(id,arr=names){return `<select id="${id}">${option(arr)}</select>`}function inp(id,placeholder='Betrag'){return `<input id="${id}" inputmode="decimal" placeholder="${placeholder}" autocomplete="off">`}
function bilRows(prefix,n=7){return Array.from({length:n},(_,i)=>`<div class="line">${select(prefix+'n'+i)}${inp(prefix+'v'+i)}</div>`).join('')}
function balanceForm(){return `<div class="grid"><div><h3>Aktiva</h3>${bilRows('a')}</div><div><h3>Passiva</h3>${bilRows('p')}</div></div><div class="grid"><label>Summe Aktiva ${inp('sumA')}</label><label>Summe Passiva ${inp('sumP')}</label></div>`}
function journalForm(prefix,n){return Array.from({length:n},(_,i)=>`<div class="card"><strong>${i+1}. Buchungszeile</strong><div class="line triple">${select(prefix+'d'+i)}${select(prefix+'c'+i)}${inp(prefix+'v'+i)}</div></div>`).join('')}
function unordered(items){return `<div class="card"><strong>Ungeordnete Angaben</strong><div class="grid">${items.map(([n,v])=>`<div>${esc(n)}: <b>${fmt(v)} €</b></div>`).join('')}</div></div>`}
function sums(arr){return arr.reduce((s,x)=>s+x[1],0)}
function balanceTable(m){return `<table><tr><th>Aktiva</th><th>€</th><th>Passiva</th><th>€</th></tr>${Array.from({length:Math.max(m.assets.length,m.liabs.length)},(_,i)=>`<tr><td>${esc(m.assets[i]?.[0]||'')}</td><td>${m.assets[i]?fmt(m.assets[i][1]):''}</td><td>${esc(m.liabs[i]?.[0]||'')}</td><td>${m.liabs[i]?fmt(m.liabs[i][1]):''}</td></tr>`).join('')}<tr><th>Summe</th><th>${fmt(sums(m.assets))}</th><th>Summe</th><th>${fmt(sums(m.liabs))}</th></tr></table>`}
function expectedJournal(m){return m.x.tx.map(t=>({d:t.debit,c:t.credit,v:t.amount}))}
function opening(m){return Object.entries(m.start).map(([n,v])=>({d:[A,W,F,B,K].includes(n)?n:'EBK',c:[A,W,F,B,K].includes(n)?'EBK':n,v}))}
function inputRows(prefix,n){return Array.from({length:n},(_,i)=>({d:$(prefix+'d'+i)?.value||'',c:$(prefix+'c'+i)?.value||'',v:num($(prefix+'v'+i)?.value)}))}
function checkJournal(prefix,expected){let got=inputRows(prefix,expected.length),missing=expected.filter(e=>!got.some(g=>g.d===e.d&&g.c===e.c&&eq(g.v,e.v))),extra=got.filter(g=>g.d||g.c||Number.isFinite(g.v)).filter(g=>!expected.some(e=>g.d===e.d&&g.c===e.c&&eq(g.v,e.v)));return [...missing.map(e=>`Es fehlt eine richtige Buchung: Prüfen Sie ${e.d} und ${e.c} sowie den Betrag.`),...extra.map((g,i)=>`Eine eingegebene Buchungszeile ist nicht korrekt. Kontrollieren Sie Soll, Haben und Betrag.`)]}
function readBalance(){let get=pre=>Array.from({length:7},(_,i)=>({n:$(pre+'n'+i)?.value||'',v:num($(pre+'v'+i)?.value)})).filter(x=>x.n||Number.isFinite(x.v));return {a:get('a'),p:get('p')}}
function checkBalance(a,p){let got=readBalance(),err=[];for(let [key,expected,label] of [['a',a,'Aktivseite'],['p',p,'Passivseite']]){let rows=got[key];if(rows.length!==expected.length)err.push(`${label}: Die Anzahl der Bilanzposten stimmt noch nicht.`);expected.forEach(([n,v],i)=>{let r=rows[i];if(!r||r.n!==n||!eq(r.v,v))err.push(`${label}, Zeile ${i+1}: Prüfen Sie Konto, Reihenfolge und Betrag.`)});if(rows.some((r,i)=>i>=expected.length))err.push(`${label}: Entfernen Sie überzählige Eingaben.`)}if(!eq(num($('sumA')?.value),sums(a)))err.push('Die Summe der Aktiva stimmt nicht.');if(!eq(num($('sumP')?.value),sums(p)))err.push('Die Summe der Passiva stimmt nicht.');return err}
function render(){let m=model(),s='';if(step===1){s=`<h2>Station 1 · Eröffnungsbilanz</h2><p>Ordnen Sie die ungeordneten Posten nach zunehmender Liquidierbarkeit beziehungsweise Fälligkeit. Berechnen Sie das Eigenkapital und beide Bilanzsummen.</p>${unordered([...m.x.assets,...m.x.liabs].sort((a,b)=>a[0].localeCompare(b[0])))}${balanceForm()}`}
if(step===2){s=`<h2>Station 2 · Eröffnungsbuchungen</h2><p>Erstellen Sie die Eröffnungsbuchungen über das EBK. Tragen Sie alle Buchungen ein; die Reihenfolge ist frei.</p>${balanceTable({assets:m.x.assets,liabs:[[E,m.start[E]],...m.x.liabs]})}${journalForm('j',opening(m).length)}`}
if(step===3){s=`<h2>Station 3 · Journal</h2><p>Ermitteln Sie für jeden Geschäftsfall Sollkonto, Habenkonto und Betrag. Achten Sie auf die Buchung auf Ziel und die indirekte Abschreibung.</p>${m.x.tx.map((t,i)=>`<div class="card"><strong>Geschäftsfall ${i+1}</strong><p>${esc(t.desc)} Betrag: ${fmt(t.amount)} €</p><div class="line triple">${select('j'+'d'+i)}${select('j'+'c'+i)}${inp('j'+'v'+i)}</div></div>`).join('')}`}
if(step===4){let entries=Object.entries(m.ledger).filter(([n])=>n!==E);s=`<h2>Station 4 · Hauptbuch</h2><p>Die Buchungen sind bereits eingetragen. Berechnen Sie den Saldo, die Abschlussseite und das Abschlusskonto. Das Eigenkapital bleibt hier bewusst ausgeklammert.</p>${entries.sort((a,b)=>a[0].localeCompare(b[0])).map(([n,l],i)=>`<div class="card"><h3>${esc(n)}</h3><div class="grid"><div><b>Soll</b><p>${l.debit.map(fmt).join(' + ')||'–'}</p></div><div><b>Haben</b><p>${l.credit.map(fmt).join(' + ')||'–'}</p></div></div><div class="line triple">${inp('hv'+i,'Saldo €')}<select id="hs${i}"><option value="">Abschlussseite</option><option>Soll</option><option>Haben</option></select><select id="ht${i}"><option value="">Abschluss über</option><option>GuV</option><option>SBK</option><option>Eigenkapital</option></select></div></div>`).join('')}`}
if(step===5){let acc=[...m.expense,...m.income].filter(n=>Math.abs(m.bal[n]||0)>.01);s=`<h2>Station 5 · Gewinn und Verlust</h2><p>Ordnen Sie die Erfolgskonten im GuV-Konto zu. Berechnen Sie den Gewinn oder Verlust und schließen Sie das Privatkonto über Eigenkapital ab.</p>${unordered(acc.map(n=>[n,Math.abs(m.bal[n])]))}${acc.map((n,i)=>`<div class="line"><strong>${esc(n)}</strong><select id="gv${i}"><option value="">GuV-Seite</option><option>Soll</option><option>Haben</option></select></div>`).join('')}<div class="grid"><label>GuV Sollsumme vor Erfolg ${inp('gs')}</label><label>GuV Habensumme vor Erfolg ${inp('gh')}</label><label>Gewinn (+) oder Verlust (−) ${inp('gp')}</label><label>Privatentnahme ${inp('pr')}</label><label>Neues Eigenkapital (Ausgangswert: ${fmt(m.start[E])} €) ${inp('ne')}</label></div>`}
if(step===6){s=`<h2>Station 6 · Schlussbilanz</h2><p>Erstellen Sie aus den ungeordneten Bestandskontensalden die Schlussbilanz. Führen Sie das Wertberichtigungskonto gesondert als passives Bestandskonto auf. Ziehen Sie es nicht von der Betriebs- und Geschäftsausstattung ab.</p>${unordered([...m.assets,...m.liabs].sort((a,b)=>a[0].localeCompare(b[0])))}${balanceForm()}`}

return s}
function evaluate(){let m=model(),err=[];if(step===1)err=checkBalance(m.x.assets,[[E,m.start[E]],...m.x.liabs]);if(step===2)err=checkJournal('j',opening(m));if(step===3){let expected=expectedJournal(m),got=inputRows('j',expected.length);expected.forEach((e,i)=>{if(got[i].d!==e.d||got[i].c!==e.c||!eq(got[i].v,e.v))err.push(`Geschäftsfall ${i+1}: Prüfen Sie Soll, Haben und Betrag.`)})}if(step===4){Object.entries(m.ledger).filter(([n])=>n!==E).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,l],i)=>{let debit=sums(l.debit.map(x=>['',x])),credit=sums(l.credit.map(x=>['',x])),diff=debit-credit,side=diff>0?'Haben':'Soll',type=n===P?'Eigenkapital':['Wareneinkauf','Mietaufwand','Zinsaufwand','Abschreibung','Bestandsänderung','Umsatzerlöse','Zinserträge'].includes(n)?'GuV':'SBK';if(!eq(num($('hv'+i)?.value),Math.abs(diff))||$('hs'+i)?.value!==side||$('ht'+i)?.value!==type)err.push(`${n}: Prüfen Sie den Saldo, die Abschlussseite und das Abschlusskonto.`)})}if(step===5){let acc=[...m.expense,...m.income].filter(n=>Math.abs(m.bal[n]||0)>.01);acc.forEach((n,i)=>{if($('gv'+i)?.value!==(m.bal[n]>0?'Soll':'Haben'))err.push(`${n}: Die GuV-Seite stimmt noch nicht.`)});let deb=acc.reduce((s,n)=>s+Math.max(m.bal[n],0),0),cred=acc.reduce((s,n)=>s+Math.max(-m.bal[n],0),0);for(let [id,v,label] of [['gs',deb,'Sollsumme'],['gh',cred,'Habensumme'],['gp',m.profit,'Gewinn/Verlust'],['pr',m.withdrawal,'Privatentnahme'],['ne',m.bal[E],'neues Eigenkapital']])if(!eq(num($(id)?.value),v))err.push(`${label}: Überprüfen Sie Ihre Berechnung.`)}if(step===6)err=checkBalance(m.assets,m.liabs);return err}
function snapshot(){return Array.from(document.querySelectorAll('#app input,#app select')).filter(el=>el.id).map(el=>({id:el.id,value:el.value}));}
function correctAnswers(k){let m=model();if(k===1)return 'Aktiva: '+m.x.assets.map(x=>x[0]+' '+fmt(x[1])+' €').join('; ')+' | Passiva: '+[[E,m.start[E]],...m.x.liabs].map(x=>x[0]+' '+fmt(x[1])+' €').join('; ');if(k===2)return opening(m).map(x=>x.d+' an '+x.c+' '+fmt(x.v)+' €').join('; ');if(k===3)return expectedJournal(m).map((x,i)=>(i+1)+'. '+x.d+' an '+x.c+' '+fmt(x.v)+' €').join('; ');if(k===4)return Object.entries(m.ledger).filter(([n])=>n!==E).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,l])=>{let d=l.debit.reduce((a,b)=>a+b,0),h=l.credit.reduce((a,b)=>a+b,0),t=n===P?'Eigenkapital':['Wareneinkauf','Mietaufwand','Zinsaufwand','Abschreibung','Bestandsänderung','Umsatzerlöse','Zinserträge'].includes(n)?'GuV':'SBK';return n+': '+fmt(Math.abs(d-h))+' €, Abschluss '+(d>h?'Haben':'Soll')+', über '+t}).join('; ');if(k===5){let acc=[...m.expense,...m.income].filter(n=>Math.abs(m.bal[n]||0)>.01);return acc.map(n=>n+': '+(m.bal[n]>0?'Soll':'Haben')).join('; ')+' | Sollsumme '+fmt(acc.reduce((s,n)=>s+Math.max(m.bal[n],0),0))+' €; Habensumme '+fmt(acc.reduce((s,n)=>s+Math.max(-m.bal[n],0),0))+' €; Ergebnis '+fmt(m.profit)+' €; Privat '+fmt(m.withdrawal)+' €; neues Eigenkapital '+fmt(m.bal[E])+' €';}return 'Aktiva: '+m.assets.map(x=>x[0]+' '+fmt(x[1])+' €').join('; ')+' | Passiva: '+m.liabs.map(x=>x[0]+' '+fmt(x[1])+' €').join('; ');}
function goNext(){const e=evaluate();history.push({station:step,issues:e,inputs:snapshot(),solution:correctAnswers(step)});errors=[];if(step<6){step++;hints=0;draw();window.scrollTo(0,0)}else{step=7;draw();window.scrollTo(0,0)}}
function check(){let e=evaluate();if(e.length){errors=e;$('feedback').innerHTML=`<b class="bad">Noch nicht ganz richtig (${e.length} Hinweise):</b><ul>${e.slice(0,14).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${e.length>14?'<p>Weitere Eingaben sind ebenfalls noch zu prüfen.</p>':''}<p>Verbessern Sie Ihre Antworten und prüfen Sie erneut. Sie verlieren keine Punkte.</p>`;return}errors=[];goNext()}
function hint(){hints++;let h=[['Ordnen Sie zuerst die Aktiv- und Passivkonten.','Berechnen Sie Eigenkapital als Vermögen minus Schulden.','Beachten Sie die Reihenfolge von Anlagevermögen bis Kassa und Eigenkapital bis kurzfristige Schulden.'],['Aktivkonten werden im Soll eröffnet.','Passivkonten werden im Haben eröffnet.','EBK steht bei Aktivkonten im Haben und bei Passivkonten im Soll.'],['Fragen Sie bei jedem Geschäftsfall: Welches Konto nimmt zu?','Aufwendungen stehen im Soll; Umsatzerlöse im Haben.','Wareneinkäufe und Miete auf Ziel erhöhen Verbindlichkeiten. Abschreibungen werden indirekt über Wertberichtigung gebucht.'],['Berechnen Sie die Differenz aus Soll- und Habenseite.','Ein Sollüberhang wird zum Ausgleich auf der Habenseite abgeschlossen.','Erfolgskonten schließen über GuV, Bestandskonten über SBK und Privat über Eigenkapital ab.'],['Aufwendungen und Erträge werden auf verschiedenen Seiten im GuV abgeschlossen.','Gewinn ist Ertrag minus Aufwand.','Privatentnahmen vermindern das Eigenkapital; ein Gewinn erhöht es.'],['Berücksichtigen Sie alle Bestandskonten nach den Geschäftsfällen.','Das Wertberichtigungskonto wird hier als eigenes passives Bestandskonto geführt.','Beide Bilanzsummen müssen übereinstimmen; ordnen Sie die Konten wie bei Station 1.']][step-1];$('hintText').innerHTML=`<div class="hint">${esc(h[Math.min(hints-1,2)])}</div>`;$('hintButton').disabled=hints>=3}
function draw(){let root=$('app');if(c===null){root.innerHTML=`<section class="panel"><h2>Probetest – Wellnesshotel Quellenhof</h2><p>Üben Sie ohne Noten und ohne verbindliche Abgabe. Sie können jede Station auch mit offenen oder falschen Antworten verlassen. Am Schluss erhalten Sie eine Fehleranalyse.</p><div class="grid"><label>Vorname<input id="first" value="${esc(person.first||'')}"></label><label>Nachname<input id="last" value="${esc(person.last||'')}"></label><label>Klasse<input id="class" value="${esc(person.cl||'')}"></label></div><p><strong>Fallbeispiel: Wellnesshotel Quellenhof</strong></p><button onclick="begin()">Probetest beginnen</button><p id="msg" class="bad"></p></section>`;return}if(step===7){root.innerHTML=`<section class="panel"><h2>Bilanzreise abgeschlossen – Ihre Fehleranalyse</h2><p>${esc(person.first)} ${esc(person.last)} · ${esc(person.cl)} · ${esc(CASES[c].name)}</p><p>Sie haben alle sechs Stationen bearbeitet. Hier sehen Sie die offenen und fehlerhaften Antworten sowie die richtigen Lösungen. Es gibt keine Note.</p>${history.map(h=>`<div class="card"><h3>Station ${h.station} – ${h.issues.length?'Noch '+h.issues.length+' offene Hinweise':'Alles richtig'}</h3>${h.issues.length?`<ul>${h.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><details><summary>Ihre Eingaben ansehen</summary><div class="small">${h.inputs.map(x=>esc(x.id)+': '+esc(x.value||'(leer)')).join('<hr>')}</div></details><details><summary>Richtige Lösung anzeigen</summary><p>${esc(h.solution)}</p></details>`:'<p class="good">Alle Antworten waren richtig.</p>'}</div>`).join('')}<button onclick="choose()">Weitere Bilanzreise auswählen</button> <button class="secondary" onclick="window.print()">Erfolg ausdrucken</button></section>`;return}root.innerHTML=`<div class="row"><button class="secondary" onclick="choose()">Probetest neu beginnen</button><span class="muted">${esc(CASES[c].name)} · ${esc(person.first)} ${esc(person.last)} · ${esc(person.cl)}</span></div><div class="progress"><div style="width:${(step-1)/6*100}%"></div></div><div>${Array.from({length:6},(_,i)=>`<span class="pill ${i+1===step?'active':''}">${i+1<step?'✓ ':''}Station ${i+1}</span>`).join('')}</div><section class="panel">${render()}<div id="feedback" class="feedback">Sie können Ihre Antworten prüfen und verbessern oder direkt zur nächsten Station gehen. Offene Fehler werden am Ende ausgewertet.</div><div class="row"><button onclick="check()">Prüfen und bei richtiger Lösung weiter</button><button class="secondary" onclick="goNext()">Weiter – auch wenn nicht alles ausgefüllt ist</button><button class="secondary" id="hintButton" onclick="hint()">Denkhilfe (${3-hints} verfügbar)</button></div><div id="hintText"></div></section>`}
draw();

// Prüfungsmodus: Antworten werden vor dem Wechsel unveränderlich gespeichert.
const MAXPTS=[10,8,10,10,7,5];let confirmed=false;
function gradeStation(k,m){
 let tests=[];const add=(ok,weight,description,correct)=>tests.push({ok:!!ok,weight,description,correct});
 if(k===1||k===6){let a=k===1?m.x.assets:m.assets,p=k===1?[[E,m.start[E]],...m.x.liabs]:m.liabs;let got=readBalance();for(let [key,expected,side] of [['a',a,'Aktiva'],['p',p,'Passiva']]){expected.forEach(([n,v],i)=>{let r=got[key][i];add(r?.n===n,2,side+' Zeile '+(i+1)+': Konto/Reihenfolge',n);add(eq(r?.v,v),1,side+' Zeile '+(i+1)+': Betrag',fmt(v)+' €')});if(got[key].length>expected.length)add(false,2,side+': überzählige Posten','Keine weiteren Posten')};add(eq(num($('sumA')?.value),sums(a)),1,'Bilanzsumme Aktiva',fmt(sums(a))+' €');add(eq(num($('sumP')?.value),sums(p)),1,'Bilanzsumme Passiva',fmt(sums(p))+' €')}
 if(k===2||k===3){let expected=k===2?opening(m):expectedJournal(m),got=inputRows('j',expected.length);expected.forEach((e,i)=>{let g=k===2?got.find(x=>x.d===e.d&&x.c===e.c):got[i];add(g?.d===e.d&&g?.c===e.c,3,'Buchung '+(i+1)+': Soll/Haben',e.d+' an '+e.c);add(g?.d===e.d&&g?.c===e.c&&eq(g?.v,e.v),1,'Buchung '+(i+1)+': vollständiger Buchungssatz',fmt(e.v)+' €')})}
 if(k===4){Object.entries(m.ledger).filter(([n])=>n!==E).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,l],i)=>{let d=l.debit.reduce((a,b)=>a+b,0),h=l.credit.reduce((a,b)=>a+b,0),side=d>h?'Haben':'Soll',type=n===P?'Eigenkapital':['Wareneinkauf','Mietaufwand','Zinsaufwand','Abschreibung','Bestandsänderung','Umsatzerlöse','Zinserträge'].includes(n)?'GuV':'SBK';add(eq(num($('hv'+i)?.value),Math.abs(d-h)),1,n+': Saldo',fmt(Math.abs(d-h))+' €');add($('hs'+i)?.value===side,1,n+': Abschlussseite',side);add($('ht'+i)?.value===type,1,n+': Abschlusskonto',type)})}
 if(k===5){let acc=[...m.expense,...m.income].filter(n=>Math.abs(m.bal[n]||0)>.01);acc.forEach((n,i)=>add($('gv'+i)?.value===(m.bal[n]>0?'Soll':'Haben'),2,n+': GuV-Seite',m.bal[n]>0?'Soll':'Haben'));let deb=acc.reduce((s,n)=>s+Math.max(m.bal[n],0),0),cred=acc.reduce((s,n)=>s+Math.max(-m.bal[n],0),0);[['gs',deb,'Sollsumme'],['gh',cred,'Habensumme'],['gp',m.profit,'Ergebnis'],['pr',m.withdrawal,'Privatentnahme'],['ne',m.bal[E],'Neues Eigenkapital']].forEach(([id,v,label])=>add(eq(num($(id)?.value),v),2,label,fmt(v)+' €'))}
 let total=tests.reduce((s,t)=>s+t.weight,0),earned=tests.reduce((s,t)=>s+(t.ok?t.weight:0),0),points=total?MAXPTS[k-1]*earned/total:0;
 return {points,misses:tests.filter(t=>!t.ok).map(t=>({description:t.description,correct:t.correct,weight:t.weight})),tests};
}
function finalNote(points){let percent=points/50*100;if(percent<45)return 'unter 4';if(percent<50)return '4';if(percent<55)return '4,5';if(percent<60)return '5';if(percent<65)return '5,5';if(percent<70)return '6';if(percent<75)return '6,5';if(percent<80)return '7';if(percent<85)return '7,5';if(percent<90)return '8';if(percent<95)return '8,5';if(percent<97.5)return '9';if(percent<100)return '9,5';return '10'}
function submitStation(){if(!confirmed){let f=$('feedback');f.innerHTML='<strong>Verbindliche Abgabe:</strong> Möchten Sie diese Station endgültig abgeben? Nicht ausgefüllte Antworten werden als falsch bewertet. Nach der Abgabe können Sie nichts mehr ändern.<div class="row"><button onclick="confirmStation()">Ja, verbindlich abgeben</button><button class="secondary" onclick="cancelSubmit()">Zurück zur Bearbeitung</button></div>';confirmed=true;f.scrollIntoView({behavior:'smooth',block:'nearest'});return}}
function cancelSubmit(){confirmed=false;$('feedback').textContent='Bearbeiten Sie Ihre Antworten weiter oder geben Sie die Station verbindlich ab.'}
function confirmStation(){if(!confirmed)return;let m=model(),g=gradeStation(step,m),inputs=snapshot();history.push({station:step,issues:g.misses.map(x=>x.description),details:g.misses,points:g.points,inputs,solution:correctAnswers(step),hints});confirmed=false;hints=0;if(step<6)step++;else step=7;draw();window.scrollTo(0,0)}
function examResult(){let raw=history.reduce((s,h)=>s+h.points,0),deductions=history.reduce((s,h)=>s+h.hints,0),points=Math.max(0,raw-deductions),pct=points*2;return `<section class="panel"><h2>Ihr Probetest – Ergebnis und Fehleranalyse</h2><div class="card"><strong>${esc(person.first)} ${esc(person.last)} · ${esc(person.cl)} · ${esc(CASES[c].name)}</strong><h2>${fmt(points)} / 50 Punkte · Note ${finalNote(points)}</h2><p>${fmt(pct)} % · Rohpunkte ${fmt(raw)} · Denkhilfen-Abzug ${deductions} · ${pct>=65?'Positiv':'Noch nicht positiv'}</p></div><h3>Auswertung nach Stationen</h3>${history.map(h=>`<div class="card"><h3>Station ${h.station}: ${fmt(h.points)} / ${MAXPTS[h.station-1]} Punkte</h3>${h.details.length?`<p>${h.details.length} nicht vollständig richtige Teilantworten:</p><ul>${h.details.map(d=>`<li><b>${esc(d.description)}</b> – richtig: ${esc(d.correct)}</li>`).join('')}</ul>`:'<p class="good">Alles richtig.</p>'}<details><summary>Gespeicherte Eingaben anzeigen</summary><p class="small">${h.inputs.map(x=>esc(x.id)+': '+esc(x.value||'(leer)')).join('<hr>')}</p></details><details><summary>Vollständige Musterlösung</summary><p>${esc(h.solution)}</p></details></div>`).join('')}<button onclick="window.print()">Ergebnis drucken / als PDF speichern</button> <button class="secondary" onclick="choose()">Probetest neu beginnen</button></section>`}
const oldDraw=draw;draw=function(){oldDraw();if(c===null){let p=document.querySelector('#app .panel p');if(p)p.textContent='Ein einziges Fallbeispiel (Wellnesshotel Quellenhof), sechs Stationen und 50 Punkte. Jede Station wird verbindlich abgegeben und danach gesperrt. Die Fehleranalyse und Note erscheinen erst am Schluss.';return}if(step===7){$('app').innerHTML=examResult();return}let buttons=[...document.querySelectorAll('#app button')];for(let b of buttons){if(b.textContent.includes('Prüfen und')){b.textContent='Station verbindlich abgeben';b.setAttribute('onclick','submitStation()')}else if(b.textContent.includes('Weiter –'))b.remove()}let f=$('feedback');if(f)f.textContent='Prüfen Sie Ihre Antworten sorgfältig. Nach der verbindlichen Abgabe können Sie diese Station nicht mehr bearbeiten.'};
const oldBegin=begin;begin=function(){oldBegin();confirmed=false};
const oldChoose=choose;choose=function(){oldChoose();confirmed=false};
</script></body></html>
